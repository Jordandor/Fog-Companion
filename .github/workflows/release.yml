name: Release Fog Companion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        shell: pwsh
        run: pnpm build

      - name: Create release assets and SHA-256 files
        shell: pwsh
        run: |
          $setup = "dist/Fog-Companion-Setup.exe"
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash
          "$setupHash  Fog-Companion-Setup.exe" | Set-Content -LiteralPath "dist/Fog-Companion-Setup.exe.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "Fog Companion ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag `
            "dist/Fog-Companion-Setup.exe" `
            "dist/Fog-Companion-Setup.exe.blockmap" `
            "dist/Fog-Companion-Setup.exe.sha256" `
            "dist/latest.yml"
